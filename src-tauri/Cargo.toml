[package]
name = "rondine"
version = "0.1.0-alpha.4"
description = "Rondine"
authors = ["Tesaguri tech"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.80"

[lib]
name = "rondine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri コア
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"

# シリアライズ
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 型付きエラー
thiserror = "2"

# ログ
log = "0.4"

# Rust → TS 型生成（boundary 型を src/bindings/ に export）。詳細: docs/APP_IDENTITY.md / TS bindings
ts-rs = { version = "10", features = ["serde-compat", "no-serde-warnings"] }

# SQLite（FTS5 同梱）。SQLCipher 暗号化は後続でフィーチャ差し替え（docs/DATABASE_SCHEMA.md）
rusqlite = { version = "0.32", features = ["bundled"] }

# OS ネイティブ資格情報ストア（Win: Credential Manager / mac: Keychain / Linux: Secret Service）
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }

# IMAP 受信（同期）。TLS は native-tls（Win=SChannel / mac=SecureTransport → OpenSSL不要）
imap = "2"
# BODYSTRUCTURE 型（imap::Fetch::bodystructure が返す型）。imap は再エクスポートしないため直接依存。
imap-proto = "0.10"
native-tls = "0.2"

# SMTP 送信。IMAP と同じく native-tls を使い OpenSSL 依存を避ける。
# ブロッキング版 SmtpTransport を spawn_blocking で回す（tokio 機能は無効）。
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "native-tls",
    "builder",
    "hostname",
    "pool",
] }

# MIME 解析（堅牢・純Rust）。docs/THREADING.md
mail-parser = "0.9"

# 画像デコード/再エンコード（HEIC は WebView 非対応のため web 形式へ変換して表示）
image = "0.25"
# HEIC/HEIF デコード（Photosky と同方式。ネイティブ libheif/libde265 を使用）
libheif-rs = "1"
# 画像レンディションを data URL で渡すための base64
base64 = "0.22"
# 画像のメタデータ（EXIF/XMP）を無劣化で除去する（送信時の位置情報漏れ対策。docs/COMPOSE.md §3）
img-parts = "0.3"
# EXIF 読み取り（GPS 有無の検査。docs/COMPOSE.md §3）。crate 名は kamadak-exif、use は exif。
kamadak-exif = "0.5"

# リモート画像の取得（明示許可時のみ・サニタイズして表示。docs/MAIL_SECURITY.md §1）。
# TLS は他と揃えて native-tls（OpenSSL 非依存）。既定機能は絞る。
# json: Google Calendar API のレスポンス/リクエスト JSON（docs/CALENDAR_SYNC.md）。
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }

# Google OAuth（PKCE）。code_verifier のハッシュ（S256）と、verifier/state の乱数生成。
# いずれも小さな純 Rust クレート（docs/CALENDAR_SYNC.md）。
sha2 = "0.10"
getrandom = "0.2"
# 自分宛メールの検証マーク（X-Rondine-Self）の HMAC-SHA256（docs/SPAM.md 自己検証）。
hmac = "0.12"

# 本文（特に HTML）の保存圧縮。テキストは zstd で 80% 以上縮む（docs/SYNC.md ストレージ最適化）
zstd = "0.13"

# DNS（MX 解決でプロバイダ自動判定。docs/ONBOARDING.md）
hickory-resolver = "0.24"

# 日時（同期ウィンドウの SINCE 日付計算）
chrono = { version = "0.4", features = ["clock"] }

# 非同期ロック（Google への push を直列化して二重 INSERT を防ぐ）。tokio は Tauri/reqwest 経由で
# 依存ツリーに既に入っているため、sync フィーチャのみを明示有効化する（追加コストは小さい）。
tokio = { version = "1", features = ["sync"] }

# 開発時のみ: .env から環境変数を読み込む（Google OAuth の Client ID/Secret を dev で渡す用途。
# 実行時に .env が無ければ何もしない。本番配布は UI 入力＝keyring 保存が正）。
dotenvy = "0.15"

# Windows で添付を既定アプリで開くとき、日本語パスを化けさせないため ShellExecuteExW を使わせる。
# tauri-plugin-opener は open クレート経由で開くが、既定は `cmd /c start` で非ASCIIパスが壊れる。
# open を直接依存に足して shellexecute-on-windows を有効化すると、フィーチャ統合でプラグイン側も
# ShellExecute 経路になる（Unicode パス対応）。docs/COMPOSE.md 添付。
[target.'cfg(windows)'.dependencies]
open = { version = "5", features = ["shellexecute-on-windows"] }

[dev-dependencies]
tempfile = "3"
