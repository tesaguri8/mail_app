<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241338"/>
      <stop offset="0.45" stop-color="#5e2a63"/>
      <stop offset="0.72" stop-color="#c85674"/>
      <stop offset="0.78" stop-color="#f2a15e"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a3a63"/>
      <stop offset="1" stop-color="#160c22"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="62%" r="30%">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffb26b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <circle cx="800" cy="600" r="70" fill="#ffe1ab"/>
  <!-- horizon / sea -->
  <rect y="620" width="1600" height="380" fill="url(#sea)"/>
  <!-- sun reflection on the water -->
  <rect x="770" y="620" width="60" height="380" fill="#ffd39a" opacity="0.25"/>
  <rect x="740" y="700" width="120" height="300" fill="#ffcf93" opacity="0.12"/>
  <!-- distant headland silhouettes -->
  <path d="M0 620 L180 585 L360 620 Z" fill="#2a1730" opacity="0.85"/>
  <path d="M1180 620 L1360 578 L1600 615 L1600 620 Z" fill="#2a1730" opacity="0.85"/>
</svg>
